<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kaleido Admin</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Arial', sans-serif;
      background: #101010;
      color: #FDFDF6;
      min-height: 100vh;
    }

    /* ── LOGIN ── */
    .login-screen {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .login-box {
      background: #1a1a1a;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      padding: 3rem 2.5rem;
      width: 100%;
      max-width: 400px;
      text-align: center;
    }

    .login-logo {
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: 4px;
      color: #FF8F35;
      margin-bottom: 0.5rem;
    }

    .login-subtitle {
      color: rgba(255,255,255,0.4);
      font-size: 0.85rem;
      margin-bottom: 2rem;
    }

    .login-input {
      width: 100%;
      padding: 0.9rem 1.2rem;
      background: #101010;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 8px;
      color: #FDFDF6;
      font-size: 1rem;
      margin-bottom: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .login-input:focus { border-color: #FF8F35; }

    .login-btn {
      width: 100%;
      padding: 0.9rem;
      background: #FF8F35;
      border: none;
      border-radius: 8px;
      color: #FDFDF6;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .login-btn:hover { background: #e67e22; }
    .login-error {
      color: #e74c3c;
      font-size: 0.85rem;
      margin-top: 0.8rem;
      display: none;
    }

    /* ── DASHBOARD ── */
    .dashboard { display: none; }

    .topbar {
      background: #1a1a1a;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .topbar-title {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 3px;
      color: #FF8F35;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .total-badge {
      background: #FF8F35;
      color: #fff;
      padding: 0.3rem 0.9rem;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .logout-btn {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.2);
      color: rgba(255,255,255,0.6);
      padding: 0.4rem 1rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.2s;
    }

    .logout-btn:hover {
      border-color: #e74c3c;
      color: #e74c3c;
    }

    .main {
      max-width: 1400px;
      margin: 0 auto;
      padding: 2rem;
    }

    /* ── TABS ── */
    .tabs {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }

    .tab-btn {
      padding: 0.6rem 1.4rem;
      background: #1a1a1a;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      color: rgba(255,255,255,0.5);
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 1px;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .tab-btn:hover { border-color: #FF8F35; color: #FF8F35; }

    .tab-btn.active {
      background: #FF8F35;
      border-color: #FF8F35;
      color: #fff;
    }

    .tab-count {
      background: rgba(0,0,0,0.2);
      padding: 0.1rem 0.5rem;
      border-radius: 10px;
      font-size: 0.75rem;
    }

    .tab-btn.active .tab-count { background: rgba(0,0,0,0.25); }

    /* ── SEARCH & FILTER ── */
    .toolbar {
      display: flex;
      gap: 1rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
      align-items: center;
    }

    .search-input {
      flex: 1;
      min-width: 200px;
      padding: 0.7rem 1rem;
      background: #1a1a1a;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      color: #FDFDF6;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-input:focus { border-color: #FF8F35; }

    .filter-select {
      padding: 0.7rem 1rem;
      background: #1a1a1a;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      color: #FDFDF6;
      font-size: 0.9rem;
      outline: none;
      cursor: pointer;
    }

    /* ── CARDS ── */
    .cards-grid {
      display: grid;
      gap: 1rem;
    }

    .sub-card {
      background: #1a1a1a;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 1.5rem;
      transition: border-color 0.2s;
    }

    .sub-card:hover { border-color: rgba(255,143,53,0.3); }

    .sub-card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 1rem;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .sub-card-name {
      font-size: 1.05rem;
      font-weight: 700;
      color: #FDFDF6;
    }

    .sub-card-email {
      font-size: 0.85rem;
      color: #FF8F35;
      margin-top: 0.2rem;
    }

    .sub-card-meta {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      flex-wrap: wrap;
    }

    .badge {
      padding: 0.25rem 0.7rem;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .badge-pending { background: rgba(241,176,32,0.2); color: #F1B020; }
    .badge-reviewed { background: rgba(49,108,128,0.3); color: #5bb8d4; }
    .badge-accepted { background: rgba(39,174,96,0.2); color: #2ecc71; }
    .badge-rejected { background: rgba(231,76,60,0.2); color: #e74c3c; }

    .date-text {
      font-size: 0.75rem;
      color: rgba(255,255,255,0.3);
    }

    .sub-card-fields {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 0.8rem;
      margin-bottom: 1rem;
    }

    .field-item {
      background: #101010;
      border-radius: 8px;
      padding: 0.7rem 1rem;
    }

    .field-label {
      font-size: 0.7rem;
      color: rgba(255,255,255,0.35);
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 0.3rem;
    }

    .field-value {
      font-size: 0.88rem;
      color: rgba(255,255,255,0.85);
      line-height: 1.5;
      word-break: break-word;
    }

    .field-item.full-width {
      grid-column: 1 / -1;
    }

    .sub-card-actions {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      padding-top: 0.8rem;
      border-top: 1px solid rgba(255,255,255,0.06);
    }

    .status-btn {
      padding: 0.35rem 0.9rem;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.1);
      background: transparent;
      color: rgba(255,255,255,0.5);
      font-size: 0.78rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .status-btn:hover { border-color: #FF8F35; color: #FF8F35; }
    .status-btn.active-status { border-color: #FF8F35; color: #FF8F35; background: rgba(255,143,53,0.1); }

    /* ── EMPTY STATE ── */
    .empty-state {
      text-align: center;
      padding: 4rem 2rem;
      color: rgba(255,255,255,0.25);
    }

    .empty-state-icon { font-size: 3rem; margin-bottom: 1rem; }
    .empty-state-text { font-size: 1rem; }

    /* ── LOADING ── */
    .loading {
      text-align: center;
      padding: 4rem;
      color: rgba(255,255,255,0.3);
      font-size: 0.9rem;
      letter-spacing: 2px;
    }
  </style>
</head>
<body>

  <!-- LOGIN SCREEN -->
  <div class="login-screen" id="login-screen">
    <div class="login-box">
      <div class="login-logo">KALEIDO</div>
      <p class="login-subtitle">ADMIN DASHBOARD</p>
      <input class="login-input" type="password" id="password-input" placeholder="Enter admin password" autocomplete="off">
      <button class="login-btn" onclick="login()">Access Dashboard</button>
      <p class="login-error" id="login-error">Incorrect password. Try again.</p>
    </div>
  </div>

  <!-- DASHBOARD -->
  <div class="dashboard" id="dashboard">

    <div class="topbar">
      <div class="topbar-title">KALEIDO ADMIN</div>
      <div class="topbar-right">
        <span class="total-badge" id="total-badge">0 submissions</span>
        <button class="logout-btn" onclick="logout()">Logout</button>
      </div>
    </div>

    <div class="main">

      <!-- Tabs -->
      <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('all')" id="tab-all">
          ALL <span class="tab-count" id="count-all">0</span>
        </button>
        <button class="tab-btn" onclick="switchTab('collaboration_requests')" id="tab-collaboration_requests">
          WORK WITH US <span class="tab-count" id="count-collaboration_requests">0</span>
        </button>
        <button class="tab-btn" onclick="switchTab('pitch_submissions')" id="tab-pitch_submissions">
          PITCHES <span class="tab-count" id="count-pitch_submissions">0</span>
        </button>
        <button class="tab-btn" onclick="switchTab('brand_inquiries')" id="tab-brand_inquiries">
          BRAND INQUIRIES <span class="tab-count" id="count-brand_inquiries">0</span>
        </button>
        <button class="tab-btn" onclick="switchTab('filmmaker_applications')" id="tab-filmmaker_applications">
          APPLICATIONS <span class="tab-count" id="count-filmmaker_applications">0</span>
        </button>
        <button class="tab-btn" onclick="switchTab('audit_log')" id="tab-audit_log">
            AUDIT LOG <span class="tab-count" id="count-audit_log">0</span>
        </button>
      </div>

      <!-- Toolbar -->
      <div class="toolbar">
        <input class="search-input" type="text" id="search-input" placeholder="Search by name or email..." oninput="renderCards()">
        <select class="filter-select" id="status-filter" onchange="renderCards()">
          <option value="all">All Statuses</option>
          <option value="pending">Pending</option>
          <option value="reviewed">Reviewed</option>
          <option value="accepted">Accepted</option>
          <option value="rejected">Rejected</option>
        </select>
      </div>

      <!-- Cards -->
      <div class="cards-grid" id="cards-grid">
        <div class="loading">LOADING SUBMISSIONS...</div>
      </div>

    </div>
  </div>

  <script>
    let adminPassword = '';
    let allData = {};
    let currentTab = 'all';
    let sessionTimeout;


    function resetSessionTimer() {
        clearTimeout(sessionTimeout);
        sessionTimeout = setTimeout(() => {
            alert('Session expired due to inactivity. Please log in again.');
            logout();
        }, 30 * 60 * 1000); // 30 minutes
    }

    // ADD THIS — reset timer on any mouse or keyboard activity
    document.addEventListener('mousemove', resetSessionTimer);
    document.addEventListener('keypress', resetSessionTimer);
    document.addEventListener('click', resetSessionTimer);


    function sanitize(str) {
    if (!str) return '—';
    return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#x27;');
    }


    // ── LOGIN ──
    function login() {
      const input = document.getElementById('password-input').value;
      if (!input) return;
      adminPassword = input;
      loadData();
    }

    document.getElementById('password-input').addEventListener('keydown', e => {
      if (e.key === 'Enter') login();
    });

    function logout() {
      adminPassword = '';
      allData = {};
      document.getElementById('login-screen').style.display = 'flex';
      document.getElementById('dashboard').style.display = 'none';
      document.getElementById('password-input').value = '';
    }

    

    // ── LOAD DATA ──
    async function loadData() {
      try {
        const res = await fetch('/api/admin/all-submissions', {
          headers: { 'x-admin-password': adminPassword }
        });

        if (res.status === 401) {
          document.getElementById('login-error').style.display = 'block';
          adminPassword = '';
          return;
        }

        document.getElementById('login-error').style.display = 'none';
        allData = await res.json();

        // Show dashboard
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('dashboard').style.display = 'block';

        updateCounts();
        renderCards();
        resetSessionTimer();

      } catch (err) {
        alert('Failed to load data: ' + err.message);
      }
    }

    // ── COUNTS ──
    function updateCounts() {
      const total =
        (allData.collaboration_requests?.length || 0) +
        (allData.pitch_submissions?.length || 0) +
        (allData.brand_inquiries?.length || 0) +
        (allData.filmmaker_applications?.length || 0);

      document.getElementById('total-badge').textContent = `${total} submissions`;
      document.getElementById('count-all').textContent = total;
      document.getElementById('count-collaboration_requests').textContent = allData.collaboration_requests?.length || 0;
      document.getElementById('count-pitch_submissions').textContent = allData.pitch_submissions?.length || 0;
      document.getElementById('count-brand_inquiries').textContent = allData.brand_inquiries?.length || 0;
      document.getElementById('count-filmmaker_applications').textContent = allData.filmmaker_applications?.length || 0;
    }

    // ── TAB SWITCH ──
    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(`tab-${tab}`).classList.add('active');
      renderCards();
    }

    // ── GET CURRENT SUBMISSIONS ──
    function getCurrentSubmissions() {
      const search = document.getElementById('search-input').value.toLowerCase();
      const statusFilter = document.getElementById('status-filter').value;

      let items = [];

      if (currentTab === 'all') {
        items = [
          ...(allData.collaboration_requests || []).map(s => ({ ...s, _collection: 'collaboration_requests' })),
          ...(allData.pitch_submissions || []).map(s => ({ ...s, _collection: 'pitch_submissions' })),
          ...(allData.brand_inquiries || []).map(s => ({ ...s, _collection: 'work_with_kaleido' })),
          ...(allData.filmmaker_applications || []).map(s => ({ ...s, _collection: 'filmmaker_applications' })),
        ].sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
      } else {
        const keyMap = {
          collaboration_requests: 'collaboration_requests',
          pitch_submissions: 'pitch_submissions',
          brand_inquiries: 'brand_inquiries',
          filmmaker_applications: 'filmmaker_applications',
        };
        const colMap = {
          collaboration_requests: 'collaboration_requests',
          pitch_submissions: 'pitch_submissions',
          brand_inquiries: 'work_with_kaleido',
          filmmaker_applications: 'filmmaker_applications',
        };
        items = (allData[keyMap[currentTab]] || []).map(s => ({ ...s, _collection: colMap[currentTab] }));
      }

      // Search filter
      if (search) {
        items = items.filter(s =>
          (s.name || '').toLowerCase().includes(search) ||
          (s.email || '').toLowerCase().includes(search)
        );
      }

      // Status filter
      if (statusFilter !== 'all') {
        items = items.filter(s => s.status === statusFilter);
      }

      return items;
    }

    // ── RENDER CARDS ──
    function renderCards() {
    const grid = document.getElementById('cards-grid');

    if (currentTab === 'audit_log') {
        renderAuditLog();
        return;
    }

    const items = getCurrentSubmissions();
    if (items.length === 0) {
        grid.innerHTML = `
            <div class="empty-state">
                <div class="empty-state-icon">📭</div>
                <p class="empty-state-text">No submissions found</p>
            </div>`;
        return;
    }
    grid.innerHTML = items.map(s => buildCard(s)).join('');
}


    async function renderAuditLog() {
    const grid = document.getElementById('cards-grid');
    grid.innerHTML = '<div class="loading">LOADING AUDIT LOG...</div>';


    try {
        const res = await fetch('/api/admin/audit-log', {
            headers: { 'x-admin-password': adminPassword }
        });

        const data = await res.json();

        if (!data.logs || data.logs.length === 0) {
            grid.innerHTML = `
                <div class="empty-state">
                    <div class="empty-state-icon">📋</div>
                    <p class="empty-state-text">No audit log entries yet</p>
                </div>`;
            return;
        }

        grid.innerHTML = data.logs.map(log => {
            const date = new Date(log.timestamp).toLocaleString('en-GB', { dateStyle: 'medium', timeStyle: 'short' });
            return `
                <div class="sub-card">
                    <div class="sub-card-header">
                        <div>
                            <div class="sub-card-name">${log.collection} — ${log.documentId}</div>
                            <div class="sub-card-email">${log.ip}</div>
                        </div>
                        <div class="sub-card-meta">
                            <span class="badge badge-${log.newStatus}">${log.newStatus.toUpperCase()}</span>
                            <span class="date-text">${date}</span>
                        </div>
                    </div>
                    <div class="sub-card-fields">
                        <div class="field-item">
                            <div class="field-label">ACTION</div>
                            <div class="field-value">${log.action}</div>
                        </div>
                        <div class="field-item">
                            <div class="field-label">COLLECTION</div>
                            <div class="field-value">${log.collection}</div>
                        </div>
                        <div class="field-item full-width">
                            <div class="field-label">USER AGENT</div>
                            <div class="field-value">${log.userAgent}</div>
                        </div>
                    </div>
                </div>
            `;
        }).join('');

        document.getElementById('count-audit_log').textContent = data.logs.length;

    } catch (err) {
        grid.innerHTML = `<div class="empty-state"><p class="empty-state-text">Failed to load audit log</p></div>`;
    }
}

    // ── BUILD CARD ──
    function buildCard(s) {
      const date = s.createdAt ? new Date(s.createdAt).toLocaleString('en-GB', { dateStyle: 'medium', timeStyle: 'short' }) : '—';
      const statusBadge = `<span class="badge badge-${s.status || 'pending'}">${(s.status || 'pending').toUpperCase()}</span>`;

      const collectionLabel = {
        collaboration_requests: 'WORK WITH US',
        pitch_submissions: 'PITCH',
        work_with_kaleido: 'BRAND INQUIRY',
        filmmaker_applications: 'APPLICATION',
      }[s._collection] || s._collection;

      // Build fields based on collection
      let fields = '';

      if (s._collection === 'collaboration_requests') {
        fields = buildFields([
          ['Form Type', s.formType],
          ['Type', s.type],
          ['Message', s.message, true],
        ]);
      } else if (s._collection === 'pitch_submissions') {
        fields = buildFields([
          ['Project Title', s.projectTitle],
          ['Project Type', s.projectType],
          ['Logline', s.logline],
          ['Concept', s.concept, true],
        ]);
      } else if (s._collection === 'work_with_kaleido') {
        fields = buildFields([
          ['Company', s.company],
          ['Project Type', s.type],
          ['Budget', s.budget],
          ['Timeline', s.timeline],
          ['Project Details', s.projectDetails, true],
        ]);
      } else if (s._collection === 'filmmaker_applications') {
        fields = buildFields([
          ['Phone', s.phone],
          ['Location', s.location],
          ['Project Title', s.projectTitle],
          ['Project Type', s.projectType],
          ['Stage', s.stage],
          ['Support Needed', s.support],
          ['Portfolio', s.portfolioLink],
          ['About', s.about, true],
          ['Draws to Filmmaking', s.draws, true],
          ['Idea', s.idea, true],
          ['Goals', s.goals, true],
          ['Why Selected', s.why, true],
        ]);
      }

      const id = s._id;
      const col = s._collection;
      const currentStatus = s.status || 'pending';

      return `
        <div class="sub-card">
          <div class="sub-card-header">
            <div>
                <div class="sub-card-name">${sanitize(s.name)}</div>
                <div class="sub-card-email">${sanitize(s.email)}</div>
            </div>
            <div class="sub-card-meta">
              <span class="badge" style="background:rgba(255,143,53,0.15);color:#FF8F35;">${collectionLabel}</span>
              ${statusBadge}
              <span class="date-text">${date}</span>
            </div>
          </div>
          <div class="sub-card-fields">${fields}</div>
          <div class="sub-card-actions">
            <span style="font-size:0.75rem;color:rgba(255,255,255,0.3);margin-right:0.5rem;">STATUS:</span>
            ${['pending','reviewed','accepted','rejected'].map(st => `
              <button class="status-btn ${currentStatus === st ? 'active-status' : ''}"
                onclick="updateStatus('${id}', '${col}', '${st}', this)">
                ${st.toUpperCase()}
              </button>
            `).join('')}
          </div>
        </div>
      `;
    }

    // ── BUILD FIELDS ──
    function buildFields(fields) {
      return fields.map(([label, value, fullWidth]) => {
        if (!value) return '';
        return `
          <div class="field-item ${fullWidth ? 'full-width' : ''}">
            <div class="field-label">${label}</div>
            <div class="field-value">${sanitize(value)}</div>
          </div>`;
      }).join('');
    }

    // ── UPDATE STATUS ──
    async function updateStatus(id, collection, status, btn) {
      try {
        const res = await fetch('/api/admin/update-status', {
          method: 'PATCH',
          headers: {
            'Content-Type': 'application/json',
            'x-admin-password': adminPassword
          },
          body: JSON.stringify({ id, collection, status })
        });

        if (res.ok) {
          // Update local data
          const keys = {
            collaboration_requests: 'collaboration_requests',
            pitch_submissions: 'pitch_submissions',
            work_with_kaleido: 'brand_inquiries',
            filmmaker_applications: 'filmmaker_applications',
          };
          const dataKey = keys[collection];
          if (allData[dataKey]) {
            const item = allData[dataKey].find(s => s._id === id);
            if (item) item.status = status;
          }

          // Update UI
          const card = btn.closest('.sub-card');
          card.querySelectorAll('.status-btn').forEach(b => b.classList.remove('active-status'));
          btn.classList.add('active-status');

          // Update badge
          const badge = card.querySelector('.badge-pending, .badge-reviewed, .badge-accepted, .badge-rejected');
          if (badge) {
            badge.className = `badge badge-${status}`;
            badge.textContent = status.toUpperCase();
          }
        }
      } catch (err) {
        alert('Failed to update status: ' + err.message);
      }
    }
  </script>

</body>
</html>
